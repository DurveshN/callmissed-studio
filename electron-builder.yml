# Minimal packaging config; installer, publishing and file associations are completed in milestone M7.
appId: com.callmissed.studio
productName: CallMissed Studio
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!branding/**'
win:
  target: nsis
  icon: build/icon.ico
