# Minimal packaging config; installer, publishing and file associations are completed in milestone M7.
appId: com.callmissed.studio
productName: CallMissed Studio
directories:
  buildResources: build
  output: release/${version}
files:
  - out/**
  - package.json
  # Only the Windows x64 ONNX Runtime binaries are needed.
  - '!node_modules/onnxruntime-node/bin/napi-v*/{darwin,linux}/**'
  - '!node_modules/onnxruntime-node/bin/napi-v*/win32/arm64/**'
# Native modules and their DLLs cannot be loaded from inside the asar archive.
asarUnpack:
  - node_modules/onnxruntime-node/**
extraResources:
  - from: resources
    to: resources
    filter:
      - '**/*'
      - '!branding/**'
win:
  target: nsis
  icon: build/icon.ico
